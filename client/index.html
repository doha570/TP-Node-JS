<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des posts</title>
    <style>
        :root {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #28212a;
            background: #f8f6f8;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            --accent: #c23e78;
            --accent-dark: #a42e64;
            --accent-soft: #fff1f7;
            --border: #ebe5ea;
            --muted: #817984;
        }
        * { box-sizing: border-box; }
        body {
            max-width: 1240px;
            margin: 0 auto;
            padding: 2rem 2rem 3rem;
            min-height: 100vh;
        }
        button, input, textarea { font: inherit; }
        .topbar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1.75rem; border-bottom: 1px solid var(--border); }
        .brand { display: flex; align-items: center; gap: .75rem; }
        .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; background: var(--accent); color: white; font-weight: 800; font-size: 1.2rem; box-shadow: 0 5px 12px #c23e7830; }
        .brand-name { font-weight: 750; letter-spacing: -.02em; }
        .brand-caption { margin-top: .1rem; color: var(--muted); font-size: .75rem; }
        .api-label { padding: .45rem .7rem; border: 1px solid #e8d8e1; border-radius: 999px; background: white; color: #685c66; font-size: .78rem; font-weight: 650; }
        .api-label::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: .45rem; border-radius: 50%; background: #c23e78; vertical-align: 1px; }
        .intro { padding: 2.25rem 0 1.75rem; }
        .eyebrow { margin: 0 0 .45rem; color: var(--accent); font-size: .72rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 0; color: #302530; font-size: clamp(1.8rem, 4vw, 2.35rem); letter-spacing: -.045em; }
        .intro p:last-child { margin: .55rem 0 0; color: var(--muted); }
        .dashboard { display: grid; grid-template-columns: minmax(270px, 340px) minmax(0, 1fr); align-items: start; gap: 1.25rem; }
        .panel { min-width: 0; border: 1px solid var(--border); border-radius: 14px; background: #fff; box-shadow: 0 3px 12px #38263108; }
        .editor-panel { position: sticky; top: 1.25rem; padding: 1.25rem; }
        .panel-heading { display: flex; align-items: center; gap: .75rem; padding-bottom: 1.1rem; border-bottom: 1px solid #f0ebef; }
        .panel-icon { display: grid; place-items: center; flex: 0 0 38px; height: 38px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); font-size: 1.25rem; font-weight: 500; }
        .panel-heading h2, .feed-heading h2 { margin: 0; color: #302530; font-size: 1rem; letter-spacing: -.02em; }
        .panel-heading p { margin: .2rem 0 0; color: var(--muted); font-size: .82rem; }
        form { display: grid; gap: 1rem; padding-top: 1.1rem; }
        label { display: grid; gap: .4rem; color: #534a54; font-size: .83rem; font-weight: 650; }
        input, textarea {
            width: 100%;
            padding: .7rem .75rem;
            border: 1px solid #ded8df;
            border-radius: 8px;
            background: #fff;
            color: #302530;
            font-size: .9rem;
            transition: border-color .18s, box-shadow .18s;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px #c23e7818; }
        textarea { min-height: 130px; resize: vertical; }
        button {
            padding: .65rem .9rem;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            font-size: .85rem;
            font-weight: 700;
            cursor: pointer;
            transition: background .18s, transform .18s, box-shadow .18s;
        }
        button:hover { background: var(--accent-dark); transform: translateY(-1px); box-shadow: 0 4px 12px #c23e782b; }
        button:focus-visible { outline: 3px solid #e9a5c3; outline-offset: 2px; }
        button.secondary { border: 1px solid #ded8df; background: #fff; color: #554a56; }
        button.secondary:hover { background: #faf7f9; box-shadow: none; }
        button.danger { background: #a94459; }
        button.danger:hover { background: #873447; }
        .submit-button { width: 100%; }
        .feed-panel { padding: 1.25rem; }
        .feed-heading { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #f0ebef; }
        .feed-heading h2 { font-size: 1.1rem; }
        .count-badge { display: inline-block; margin-left: .35rem; padding: .18rem .5rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent-dark); font-size: .73rem; font-weight: 700; vertical-align: 2px; }
        .refresh-button { flex: 0 0 auto; }
        #posts { display: grid; gap: .75rem; padding-top: 1rem; }
        #posts article { min-width: 0; padding: 1rem 1.1rem; border: 1px solid #eee8ed; border-radius: 10px; background: #fff; transition: border-color .18s, box-shadow .18s; }
        #posts article:hover { border-color: #e4c4d2; box-shadow: 0 4px 14px #3826310c; }
        #posts h3 { margin: 0 0 .4rem; color: #332833; font-size: .98rem; line-height: 1.4; overflow-wrap: anywhere; }
        #posts p { line-height: 1.6; overflow-wrap: anywhere; }
        #posts .post-meta { margin: 0; color: var(--muted); font-size: .78rem; }
        #posts .post-body { margin: .7rem 0 0; color: #625a64; font-size: .88rem; white-space: pre-line; }
        .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .9rem; padding-top: .75rem; border-top: 1px solid #f3eef2; }
        #message { min-height: 1.5rem; margin: .8rem 0 0; color: var(--accent-dark); font-size: .85rem; font-weight: 600; }
        .empty-state { padding: 2.5rem 1rem; color: var(--muted); text-align: center; }
        @media (max-width: 760px) {
            body { padding: 1.25rem 1rem 2rem; }
            .dashboard { grid-template-columns: minmax(0, 1fr); }
            .editor-panel { position: static; }
            .intro { padding-top: 1.75rem; }
        }
        @media (max-width: 420px) {
            .topbar { align-items: flex-start; }
            .api-label { font-size: .7rem; }
            .feed-panel, .editor-panel { padding: 1rem; }
            .feed-heading { align-items: flex-start; }
            .refresh-button { padding: .55rem .65rem; }
            .actions button { flex: 1; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark" aria-hidden="true">P</div>
            <div>
                <div class="brand-name">Postly</div>
                <div class="brand-caption">Espace de gestion</div>
            </div>
        </div>
        <span class="api-label">API REST</span>
    </header>

    <section class="intro">
        <p class="eyebrow">Tableau de bord</p>
        <h1>Gestion des publications</h1>
        <p>Créez, modifiez et organisez vos publications depuis un seul endroit.</p>
    </section>

    <main class="dashboard">
        <aside class="panel editor-panel">
            <div class="panel-heading">
                <span class="panel-icon" aria-hidden="true">+</span>
                <div>
                    <h2 id="form-title">Nouvelle publication</h2>
                    <p>Renseignez les informations ci-dessous.</p>
                </div>
            </div>
            <form id="post-form">
                <input id="post-id" type="hidden">
                <label for="user-id">ID utilisateur
                    <input id="user-id" type="number" min="1" value="1" required>
                </label>
                <label for="title">Titre
                    <input id="title" maxlength="300" placeholder="Le titre de votre publication" required>
                </label>
                <label for="body">Contenu
                    <textarea id="body" placeholder="Rédigez votre publication..." required></textarea>
                </label>
                <button class="submit-button" type="submit">Enregistrer la publication</button>
                <button id="cancel-edit" class="secondary" type="button" hidden>Annuler la modification</button>
            </form>
        </aside>

        <section class="panel feed-panel" aria-labelledby="feed-title">
            <div class="feed-heading">
                <div>
                    <p class="eyebrow">Bibliothèque</p>
                    <h2 id="feed-title">Publications <span id="post-count" class="count-badge">0</span></h2>
                </div>
                <button id="refresh-posts" class="secondary refresh-button" type="button">Actualiser</button>
            </div>
            <p id="message" role="status" aria-live="polite"></p>
            <section id="posts" aria-live="polite"></section>
        </section>
    </main>

    <script>
        const API_URL = 'http://localhost:3000/api/posts';
        const form = document.getElementById('post-form');
        const message = document.getElementById('message');
        const postsContainer = document.getElementById('posts');
        const cancelEditButton = document.getElementById('cancel-edit');
        const postCount = document.getElementById('post-count');

        async function request(url, options) {
            const response = await fetch(url, options);
            const data = response.status === 204 ? null : await response.json();
            if (!response.ok) {
                throw new Error(data && data.error ? data.error : 'La requête a échoué.');
            }
            return data;
        }

        function resetForm() {
            form.reset();
            document.getElementById('post-id').value = '';
            document.getElementById('user-id').value = '1';
            document.getElementById('form-title').textContent = 'Nouvelle publication';
            cancelEditButton.hidden = true;
        }

        async function loadPosts() {
            try {
                const posts = await request(API_URL);
                postsContainer.replaceChildren();
                postCount.textContent = posts.length;
                if (posts.length === 0) {
                    const emptyState = document.createElement('p');
                    emptyState.className = 'empty-state';
                    emptyState.textContent = 'Aucune publication pour le moment. Créez-en une avec le formulaire.';
                    postsContainer.append(emptyState);
                    return;
                }
                posts.forEach(post => {
                    const article = document.createElement('article');
                    const heading = document.createElement('h3');
                    const author = document.createElement('p');
                    const content = document.createElement('p');
                    const actions = document.createElement('div');
                    const editButton = document.createElement('button');
                    const deleteButton = document.createElement('button');

                    heading.textContent = post.title;
                    author.className = 'post-meta';
                    content.className = 'post-body';
                    author.textContent = `Publication #${post.id} · Utilisateur ${post.userId}`;
                    content.textContent = post.body;
                    actions.className = 'actions';
                    editButton.type = 'button';
                    editButton.className = 'secondary';
                    editButton.textContent = 'Modifier';
                    editButton.addEventListener('click', () => {
                        document.getElementById('post-id').value = post.id;
                        document.getElementById('user-id').value = post.userId;
                        document.getElementById('title').value = post.title;
                        document.getElementById('body').value = post.body;
                        document.getElementById('form-title').textContent = `Modifier #${post.id}`;
                        cancelEditButton.hidden = false;
                        form.scrollIntoView({ behavior: 'smooth' });
                    });
                    deleteButton.type = 'button';
                    deleteButton.className = 'danger';
                    deleteButton.textContent = 'Supprimer';
                    deleteButton.addEventListener('click', async () => {
                        try {
                            await request(`${API_URL}/${post.id}`, { method: 'DELETE' });
                            message.textContent = 'Post supprimé.';
                            await loadPosts();
                        } catch (error) {
                            message.textContent = error.message;
                        }
                    });

                    actions.append(editButton, deleteButton);
                    article.append(heading, author, content, actions);
                    postsContainer.append(article);
                });
            } catch (error) {
                message.textContent = `Erreur de chargement : ${error.message}`;
            }
        }

        form.addEventListener('submit', async event => {
            event.preventDefault();
            const id = document.getElementById('post-id').value;
            const post = {
                userId: Number(document.getElementById('user-id').value),
                title: document.getElementById('title').value,
                body: document.getElementById('body').value
            };

            try {
                await request(id ? `${API_URL}/${id}` : API_URL, {
                    method: id ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(post)
                });
                message.textContent = id ? 'Post mis à jour.' : 'Post créé.';
                resetForm();
                await loadPosts();
            } catch (error) {
                message.textContent = error.message;
            }
        });

        cancelEditButton.addEventListener('click', resetForm);
        document.getElementById('refresh-posts').addEventListener('click', loadPosts);
        loadPosts();
    </script>
</body>
</html>
